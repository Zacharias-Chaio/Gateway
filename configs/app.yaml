# 网关， 命名规则:gw_001, gw_002, gw_003, ...
gateway:
  gw_id: gw_001

# 日志相关参数。
log:
  level: info              # 日志级别：debug | info | warn | error
  console: true            # 终端窗口输出
  file: logs/gateway.log   # 文件输出路径（留空则不落文件）
  maxSizeMB: 20            # 单文件大小上限（MB），超过即触发大小轮转
  maxBackups: 30           # 保留的历史文件份数
  maxAgeDays: 30           # 历史文件保留天数
  compress: true           # 轮转后的历史文件是否 gzip 压缩
  dailyRotate: true        # 是否每日 00:00 轮转
  bufferSize: 500          # 前端出口环形缓冲保留的最近日志条数

#  Core NATS 数据出口配置。
nats:
  enabled: true
  url: nats://127.0.0.1:4222
  name: gateway
  queueSize: 4096
  connectTimeout: 2000
  reconnectWait: 2000
  maxReconnects: -1
  retryOnFailedConnect: true
  reconnectBufSize: 8388608
  pingInterval: 20000
  maxPingsOut: 3
  subjectPrefix: powerpulse.gateway
